# Render Blueprint: ücretsiz statik web sitesi, veritabani gerekmez.
services:
  - type: web
    name: vardiyamatik
    runtime: static
    buildCommand: echo "VardiyaMatik statik dosyalar hazir"
    staticPublishPath: public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin